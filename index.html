<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <h1>Stargazers log</h1>
      <p class="intro">A log of the repositories I've starred.</p>
      <p id="list-status" class="status" role="status" aria-live="polite">Loading starred repositories…</p>
      <ul id="repository-list" class="repository-list" aria-label="Starred repositories"></ul>
    </main>
  </body>
</html>
